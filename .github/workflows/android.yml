name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RESERVA_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.RESERVA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: reserva-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Gerar AAB assinado para a Play Store
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          RESERVA_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          RESERVA_KEYSTORE_PASSWORD: ${{ secrets.RESERVA_KEYSTORE_PASSWORD }}
          RESERVA_KEY_ALIAS: ${{ secrets.RESERVA_KEY_ALIAS }}
          RESERVA_KEY_PASSWORD: ${{ secrets.RESERVA_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RESERVA_KEYSTORE_FILE"
          ./gradlew bundleRelease --no-daemon
          rm -f "$RESERVA_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: reserva-aab-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
