name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RESERVA_VERSION_CODE: ${{ github.run_number }}
      VERSAO: 1.0.${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.RESERVA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Lista dos vídeos narrados
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download videos-cursos -p manifesto.json -O public/videos-narrados.json --clobber || echo "Ainda sem vídeos narrados."

      - name: Build web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar chave de assinatura
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "RESERVA_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gerar APK e AAB assinados
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          RESERVA_KEYSTORE_PASSWORD: ${{ secrets.RESERVA_KEYSTORE_PASSWORD }}
          RESERVA_KEY_ALIAS: ${{ secrets.RESERVA_KEY_ALIAS }}
          RESERVA_KEY_PASSWORD: ${{ secrets.RESERVA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/sbv-$VERSAO.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../release/sbv-$VERSAO-play-store.aab"

      - name: Gerar APK de teste
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk "../release/sbv-$VERSAO-teste.apk"

      - name: Apagar chave de assinatura
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Escrever o que mudou
        run: python3 scripts/notas_release.py "${{ github.server_url }}/${{ github.repository }}" "$VERSAO" > "$RUNNER_TEMP/notas.md"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tentativa in 1 2 3; do
            if gh release view "v$VERSAO" >/dev/null 2>&1; then
              gh release upload "v$VERSAO" release/* --clobber && exit 0
            elif gh release create "v$VERSAO" release/* \
              --title "SBV $VERSAO" \
              --notes-file "$RUNNER_TEMP/notas.md" \
              --target "$GITHUB_SHA"; then
              exit 0
            fi
            echo "Tentativa $tentativa falhou. Tentando de novo em 20 segundos."
            sleep 20
          done
          exit 1
